<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fennec — Self-Driving Workflows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Questrial&family=Urbanist:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="hero">
    <!-- z-index 0: Background video -->
    <video
      class="hero__video"
      src="images/hero-video.mp4"
      poster="images/hero-fallback.png"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
    ></video>

    <!-- z-index 1: Gradient shade -->
    <div class="hero__shade"></div>

    <!-- z-index 2: Fox 3D canvas -->
    <canvas id="fox" aria-label="Cute 3D red fox holding a boba tea"></canvas>

    <!-- z-index 5: Headline -->
    <h1 class="headline">
      <span>streamlined</span>
      <span class="u">operations</span>
      <span>feel</span>
      <span class="u indent">breezy</span>
    </h1>

    <!-- z-index 6: Menu backdrop -->
    <div class="menu-backdrop" data-close></div>

    <!-- z-index 7: Menu panel -->
    <nav class="menu" id="menu" aria-label="Main menu">
      <ul class="menu__list">
        <li class="menu__item">
          <a class="menu__link" href="#platform"><small>01</small>platform<span class="arrow">&rarr;</span></a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="#story"><small>02</small>story<span class="arrow">&rarr;</span></a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="#community"><small>03</small>community<span class="arrow">&rarr;</span></a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="#billing"><small>04</small>billing<span class="arrow">&rarr;</span></a>
        </li>
        <li class="menu__item">
          <a class="menu__link" href="#connect"><small>05</small>connect<span class="arrow">&rarr;</span></a>
        </li>
      </ul>
      <div class="menu__foot">
        <a class="menu__cta" href="#begin">begin today <i>&rarr;</i></a>
        <div class="menu__social">
          <a href="https://x.com" target="_blank" rel="noopener">x</a>
          <a href="https://discord.com" target="_blank" rel="noopener">discord</a>
          <a href="https://github.com" target="_blank" rel="noopener">github</a>
        </div>
      </div>
    </nav>

    <!-- z-index 8: Top nav -->
    <header class="nav">
      <nav class="nav__links" aria-label="Navigation links">
        <a href="#platform">platform</a>
        <button class="toggle" type="button" aria-label="Toggle theme"></button>
        <a href="#story">story</a>
        <a href="#community" class="hide-sm">community</a>
      </nav>
      <div class="brand">
        <div class="brand__logo">
          <svg viewBox="0 0 20 20" width="20" height="20" fill="#1a1410" aria-hidden="true">
            <circle cx="10" cy="10" r="4.2" />
            <g id="ray"><path d="M10 0.6 L11.1 4.2 L8.9 4.2 Z" /></g>
            <use href="#ray" transform="rotate(30 10 10)" />
            <use href="#ray" transform="rotate(60 10 10)" />
            <use href="#ray" transform="rotate(90 10 10)" />
            <use href="#ray" transform="rotate(120 10 10)" />
            <use href="#ray" transform="rotate(150 10 10)" />
            <use href="#ray" transform="rotate(180 10 10)" />
            <use href="#ray" transform="rotate(210 10 10)" />
            <use href="#ray" transform="rotate(240 10 10)" />
            <use href="#ray" transform="rotate(270 10 10)" />
            <use href="#ray" transform="rotate(300 10 10)" />
            <use href="#ray" transform="rotate(330 10 10)" />
          </svg>
        </div>
        <span class="brand__name">FENNEC</span>
        <button
          class="brand__menu"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>
  </main>

  <!-- Scripts -->
  <script src="js/menu.js"></script>
  <script src="js/fox.js"></script>
</body>
</html>
